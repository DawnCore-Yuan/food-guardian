# 網頁遊戲（食安防衛隊）｜區網預覽 nginx 設定
# 只做靜態檔案服務；不設 proxy_pass、不快取、不以 index.html 掩蓋錯誤。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 關閉目錄列表
    autoindex off;

    # HTML：不快取，改版後重新整理即可拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        # 沒有 SPA 路由需求：找不到的檔案一律 404，避免 JS／圖片 404 被 index.html 掩蓋
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|webp|ico|json|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
}
